{% load socialaccount %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;

            background: linear-gradient(135deg, #f5f7fa, #e4e8ef);
            color: #111827;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            padding: 40px 32px;

            background: #ffffff;
            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.08),
                0 4px 12px rgba(0, 0, 0, 0.04);
        }

        .login-title {
            margin-bottom: 12px;

            font-size: 30px;
            font-weight: 700;
        }

        .login-description {
            margin-bottom: 30px;

            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            padding: 14px 20px;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            background: #ffffff;
            color: #111827;

            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .google-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
            transform: translateY(-1px);
        }

        .back-link {
            display: inline-block;

            margin-top: 22px;

            color: #6b7280;

            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #111827;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px;
                border-radius: 20px;
            }

            .login-title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <h1 class="login-title">
            Welcome back
        </h1>

        <p class="login-description">
            Sign in with your Google account to continue.
        </p>

        <form action="{% provider_login_url 'google' %}" method="post">
            {% csrf_token %}

            <button type="submit" class="google-btn">
                Continue with Google
            </button>
        </form>

        <a href="{% url 'home' %}" class="back-link">
            ← Back to home
        </a>

    </main>

</body>

</html>
