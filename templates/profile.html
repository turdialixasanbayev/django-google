<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;

            background: linear-gradient(135deg, #f5f7fa, #e4e8ef);
            color: #1f2937;
        }

        .profile-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;

            background: #ffffff;
            border-radius: 24px;
            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.08),
                0 4px 12px rgba(0, 0, 0, 0.04);
        }

        .profile-title {
            margin-bottom: 28px;
            font-size: 26px;
            font-weight: 700;
            color: #111827;
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            object-fit: cover;

            border-radius: 50%;
            border: 4px solid #ffffff;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);

            margin-bottom: 20px;
        }

        .profile-name {
            margin-bottom: 24px;

            font-size: 24px;
            font-weight: 700;
            color: #111827;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .info-item {
            padding: 14px 16px;

            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .info-label {
            display: block;
            margin-bottom: 4px;

            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;

            color: #6b7280;
        }

        .info-value {
            font-size: 16px;
            font-weight: 500;
            color: #1f2937;
        }

        .logout-btn {
            width: 100%;
            margin-top: 24px;
            padding: 13px 20px;

            border: none;
            border-radius: 12px;

            background: #111827;
            color: #ffffff;

            font-size: 15px;
            font-weight: 600;
            font-family: inherit;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .logout-btn:hover {
            background: #374151;
            transform: translateY(-1px);
        }

        .logout-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .profile-card {
                padding: 32px 20px;
                border-radius: 20px;
            }

            .profile-title {
                font-size: 23px;
            }

            .profile-picture {
                width: 100px;
                height: 100px;
            }

            .profile-name {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <main class="profile-card">

        <h1 class="profile-title">Google Profile</h1>

        {% if picture %}
        <img class="profile-picture" src="{{ picture }}" alt="{{ name }}">
        {% endif %}

        <h2 class="profile-name">{{ name }}</h2>

        <div class="profile-info">

            <div class="info-item">
                <span class="info-label">First name</span>
                <span class="info-value">{{ given_name }}</span>
            </div>

            <div class="info-item">
                <span class="info-label">Last name</span>
                <span class="info-value">{{ family_name }}</span>
            </div>

        </div>

        <form action="{% url 'account_logout' %}" method="post">
            {% csrf_token %}

            <button type="submit" class="logout-btn">
                Logout
            </button>
        </form>

    </main>

</body>

</html>
