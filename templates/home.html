<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;

            background: linear-gradient(135deg, #f5f7fa, #e4e8ef);
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 520px;

            padding: 48px 36px;

            background: #ffffff;
            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.08),
                0 4px 12px rgba(0, 0, 0, 0.04);
        }

        h1 {
            margin-bottom: 12px;
            font-size: 32px;
        }

        p {
            margin-bottom: 32px;
            color: #6b7280;
            line-height: 1.6;
        }

        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            padding: 14px 20px;

            border-radius: 12px;

            background: #111827;
            color: white;

            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .login-btn:hover {
            background: #374151;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .container {
                padding: 36px 20px;
            }

            h1 {
                font-size: 27px;
            }
        }

        .logout-btn {
            width: 100%;
            margin-top: 24px;
            padding: 13px 20px;

            border: none;
            border-radius: 12px;

            background: #111827;
            color: #ffffff;

            font-size: 15px;
            font-weight: 600;
            font-family: inherit;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .logout-btn:hover {
            background: #374151;
            transform: translateY(-1px);
        }

        .logout-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <main class="container">

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <h1>Welcome</h1>

        <p>
            Welcome to our website. Sign in to access your profile.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            Login
        </a>

        <form action="{% url 'account_logout' %}" method="post">
            {% csrf_token %}

            <button type="submit" class="logout-btn">
                Logout
            </button>
        </form>

    </main>

</body>

</html>
